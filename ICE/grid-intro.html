<html lang = "en">
<head>
    <style>
        div { 
            width: 100%;
            height: 50px;
            background: black;
            color: aliceblue;
        }
        body {
            display: grid;
            grid-template-columns: 1fr 200px 1fr;
            gap: 20px;
        }
        #first {
            background-color: blueviolet;
            grid-column: 1 / 4;
        }
        div:nth-child(2) {
            background-color: chocolate;
            grid-row: 2/4;
            height: 100px;
        }
        div:nth-child(3) {
            grid-row: span 2;
        }
        div:nth-child(6) {
            grid-column: span 3;
            grid-row: span 10;
        }
    </style>    



</head>
<body>
    <div id="first">
        1
    </div>
    <div>
        2
    </div>
    <div>
        3
    </div>
    <div>
        4
    </div>
    <div>
        5
    </div>
    <div>
        6
    </div>


</body>
</html>
