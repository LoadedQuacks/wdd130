<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>

        body {
        display: flex;
        align-content: center;
       }
       #background {
        background-image: url("images/christus.webp");
        border: 4px solid black;
        border-radius: 10%;
        width: 1000px;
        height: 700px;
        object-fit: cover;
        }
     h1 {
        font-family: Arial, Helvetica, sans-serif;
        color: #e8eced;
        font-weight: lighter;
        text-align: center;
       }
      h2 {
        font-family: Arial, Helvetica, sans-serif;
        color: #e8eced;
        font-weight: lighter;
        text-align: center;
       }
       img {
        border-radius: 100%;
        object-fit: center;
        object-position: center center;
        border: 4px solid white;
        object-fit: cover;
        height: 100px;
        width: 100px;
       }
       #presidency {
        object-fit: center;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 25px;
       }
       #oaks {
        height: 150px;
        width: 150px;
       }
       #twelve {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        justify-items: center;
        margin-left: 20%;
        margin-right: 20%;
        gap: 15px;
       }
    </style>
</head>
<body>
   <div id="background">
    <h1>First Presidency</h1>
    <div id="presidency">
        <img src="images\eyring.webp" alt="eyring">
        <img id="oaks" src="images\oaks.webp" alt="oaks">
        <img src="images\christofferson.webp" alt="christofferson">
    </div>
    <h2>Quorum of the Twelve Apostles</h2>
    <div id="twelve">
        <img src="images\anderson.webp" alt="oaks">
        <img src="images\bednar.webp" alt="oaks">
        <img src="images\causse.webp" alt="oaks">
        <img src="images\cook.webp" alt="oaks">
        <img src="images\gilbert.webp" alt="oaks">
        <img src="images\gong.webp" alt="oaks">
        <img src="images\kearon.webp" alt="oaks">
        <img src="images\rasband.webp" alt="oaks">
        <img src="images\renlund.webp" alt="oaks">
        <img src="images\soares.webp" alt="oaks">
        <img src="images\stevenson.webp" alt="oaks">
        <img src="images\uchtdorf.webp" alt="oaks">
        
    </div>
   </div>
</body>
</html>
